name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Setup key
      - name: Setup SSH key
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.key }}" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Deploy
      - name: Deploy
        run: cd dist && rsync -e "ssh -p 20022 -i $HOME/.ssh/key -o StrictHostKeyChecking=no" --archive --compress --delete ./ m71516@hostru14.fornex.host:/home/m71516/public_html/demos.verstaem.online
